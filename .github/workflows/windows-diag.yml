# Temporary: where `zs build` hangs on Windows (CI run 42016744928: zs --version and zs doctor
# work, zs build examples/simple.zs runs past 20 minutes on both runners). Each step bounded;
# after a timeout, the processes left say which tool was waited on.
name: windows-diag
on:
  push:
    branches: [claude/windows-diag]
permissions:
  contents: read
  actions: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, archive: zs-ci-windows-x86_64, triple: x86_64-windows-gnu }
          - { os: windows-11-arm, archive: zs-ci-windows-aarch64, triple: aarch64-windows-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: releases
          path: dist
          run-id: 42016744928
          github-token: ${{ github.token }}
      - run: choco install -y llvm zig && choco upgrade -y llvm
      - run: tar -xzf "dist/${{ matrix.archive }}.tar.gz" -C dist
      - env:
          ZS_NO_SERVER: 1
          T: ${{ matrix.triple }}
        run: |
          set +e
          zs=$PWD/dist/${{ matrix.archive }}/zs
          left() { ps -W | grep -iE 'clang|zig|zs|lld|ld\.exe|cc1' ; }
          sweep() { for p in zs.exe clang.exe zig.exe ld.lld.exe lld.exe; do taskkill //F //T //IM $p >/dev/null 2>&1; done; }
          step() {
            local t=$1; shift
            echo "::group::$*"
            local s=$(date +%s); timeout "$t" "$@"; local c=$?
            echo "=> exit $c after $(( $(date +%s) - s ))s"
            if [ $c = 124 ]; then echo "=> timed out; still running:"; left; sweep; fi
            echo "::endgroup::"
            echo "SUMMARY $c $(( $(date +%s) - s ))s: $*" >> "$RUNNER_TEMP/summary"
          }
          step 30 clang --version
          step 30 zig version
          printf '#include <stdio.h>\nint main(void) { puts("hi"); return 0; }\n' > "$RUNNER_TEMP/hello.c"
          step 900 zig cc -target "$T" "$RUNNER_TEMP/hello.c" -o "$RUNNER_TEMP/hello.exe"
          step 30 "$RUNNER_TEMP/hello.exe"
          step 900 zig cc -target "$T" "$RUNNER_TEMP/hello.c" -o "$RUNNER_TEMP/hello2.exe"
          step 120 "$zs" check examples/simple.zs
          step 600 "$zs" build examples/simple.zs --release --time -o "$RUNNER_TEMP/r.exe"
          step 30 "$RUNNER_TEMP/r.exe"
          step 600 env ZS_WORKERS=1 "$zs" build examples/simple.zs --time -o "$RUNNER_TEMP/one.exe"
          step 30 "$RUNNER_TEMP/one.exe"
          step 600 "$zs" build examples/simple.zs --time -o "$RUNNER_TEMP/d.exe"
          step 30 "$RUNNER_TEMP/d.exe"
          echo; cat "$RUNNER_TEMP/summary"
