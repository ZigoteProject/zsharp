# The suite on every platform Z# ships for (phase 11.5). Linux x86-64 builds the compiler from
# stage 0 in the dev container, runs the whole suite and makes the release archive of every
# platform (src/release.sh); each other runner unpacks its own archive and runs the suite with
# that compiler, built natively (tests/bootstrap.sh included: it builds itself to the same bytes).
name: test
on: [push, pull_request]
# the job token reads the repository (and its releases), nothing more
permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      # the dev image (LLVM, Swift, Rust, OCaml, Wine) needs more disk than the runner has free:
      # the SDKs it comes with go first
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the whole history: test.sh diffs the grammar against Zed's pinned commit
      # stage 0: this repository's release v0.6, into dist/ where ./dev looks first (a private
      # repository's releases need the job's token)
      - run: gh release download v0.6 -p 'zs-0.6-linux-x86_64.tar.gz' -D dist
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ./dev ./test.sh
      - run: ./dev bash -c 'src/release.sh build/zs ci aarch64-macos x86_64-macos x86_64-windows-gnu aarch64-windows-gnu aarch64-linux-gnu'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: releases
          path: dist/zs-ci-*

  native:
    needs: linux-x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, archive: zs-ci-macos-aarch64 }
          - { os: macos-13, archive: zs-ci-macos-x86_64 }
          - { os: windows-2025, archive: zs-ci-windows-x86_64 }
          - { os: windows-11-arm, archive: zs-ci-windows-aarch64 }
          - { os: ubuntu-24.04-arm, archive: zs-ci-linux-aarch64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the whole history: test.sh diffs the grammar against Zed's pinned commit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: releases
          path: dist
      # clang and libclang from LLVM's release or Homebrew's llvm (Apple's clang lags), and zig
      - if: runner.os == 'macOS'
        run: brew install llvm zig && echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        run: choco install -y llvm zig
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld libclang-dev zig valgrind gdb
      - run: tar -xzf "dist/${{ matrix.archive }}.tar.gz" -C dist
      - run: ./test.sh --zs "dist/${{ matrix.archive }}/zs"
