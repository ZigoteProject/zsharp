# The suite on every platform Z# ships for (phase 11.5). Linux x86-64 builds the compiler from
# stage 0 in the dev container, runs the whole suite and makes the release archive of every
# platform (src/release.sh); each other runner unpacks its own archive and runs the suite with
# that compiler, built natively (tests/bootstrap.sh included: it builds itself to the same bytes).
name: test
on: [push, pull_request]
# the job token reads the repository (and its releases), nothing more
permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      # the dev image (LLVM, Swift, Rust, OCaml, Wine) needs more disk than the runner has free:
      # the SDKs it comes with go first
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the whole history: test.sh diffs the grammar against Zed's pinned commit
      # stage 0: this repository's release v0.6.1, into dist/ where ./dev looks first (a private
      # repository's releases need the job's token)
      - run: gh release download v0.6.1 -p 'zs-0.6.1-linux-x86_64.tar.gz' -D dist
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ./dev ./test.sh
      - run: ./dev bash -c 'src/release.sh build/zs ci aarch64-macos x86_64-macos x86_64-windows-gnu aarch64-windows-gnu aarch64-linux-gnu'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: releases
          path: dist/zs-ci-*

  native:
    needs: linux-x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, archive: zs-ci-macos-aarch64 }
          - { os: macos-15-intel, archive: zs-ci-macos-x86_64 }
          - { os: windows-2025, archive: zs-ci-windows-x86_64 }
          - { os: windows-11-arm, archive: zs-ci-windows-aarch64 }
          - { os: ubuntu-24.04-arm, archive: zs-ci-linux-aarch64 }
    runs-on: ${{ matrix.os }}
    # a suite takes 15 to 80 minutes; one that stops making progress ends here, its log kept
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the whole history: test.sh diffs the grammar against Zed's pinned commit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: releases
          path: dist
      # zig, and a bash newer than macOS's 3.2, whose set -u takes an empty array for an unset one;
      # macOS has no timeout, which test.sh and its scripts call: coreutils' gtimeout under that
      # name, and none of its other tools, whose GNU flags would shadow the BSD ones. SDKROOT is
      # how an LLVM that isn't Apple's (clang, and libclang for import c) finds the SDK's headers
      - if: runner.os == 'macOS'
        run: |
          brew install zig bash coreutils
          mkdir -p "$RUNNER_TEMP/bin" && ln -sf "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/bin/timeout"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      # clang and libclang 23 (Apple's clang lags): Homebrew's llvm on arm64; on Intel, where
      # Homebrew's newest is 22 and LLVM's releases have no build, conda-forge's
      - if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: brew install llvm && echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/micromamba" https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-osx-64
          chmod +x "$RUNNER_TEMP/micromamba"
          # nocfg: upstream clang, without conda's configuration files (SDKROOT gives the SDK)
          "$RUNNER_TEMP/micromamba" create -y -q -r "$RUNNER_TEMP/mamba" -p "$RUNNER_TEMP/llvm" -c conda-forge \
            'clang=23.1.4=*nocfg*' 'clangxx=23.1.4=*nocfg*' libclang=23.1.4 lld=23.1.4 llvm-tools=23.1.4 compiler-rt=23.1.4
          echo "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        run: choco install -y llvm zig
      # the dev image's LLVM and zig, from their releases (Ubuntu's clang is too old for the IR,
      # and it packages no zig)
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zstd valgrind gdb pkg-config
          dir=LLVM-23.1.4-Linux-ARM64
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/$dir.tar.zst | zstd -dc --long=31 \
            | sudo tar -x -C /opt --wildcards "$dir/lib/clang/*" "$dir/include/clang-c/*" "$dir/lib/libclang.so*" \
                $(for t in clang clang-23 clang++ lld ld.lld llvm-ar llvm-nm llvm-objdump llvm-strip llvm-profdata llvm-symbolizer llvm-dis llvm-as opt llc; do echo "$dir/bin/$t"; done)
          sudo mv /opt/$dir /opt/llvm && echo /opt/llvm/bin >> "$GITHUB_PATH"
          curl -fsSL https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz | sudo tar -xJ -C /opt
          echo /opt/zig-aarch64-linux-0.16.0 >> "$GITHUB_PATH"
      - run: tar -xzf "dist/${{ matrix.archive }}.tar.gz" -C dist
      # the compiler on its own first, each step bounded, so a hang (Windows's suites have printed
      # nothing in six hours) shows where it is
      - env:
          ZS_NO_SERVER: 1
        run: |
          zs=dist/${{ matrix.archive }}/zs; out=$RUNNER_TEMP/simple; [ "$RUNNER_OS" = Windows ] && out=$out.exe
          timeout 60 "$zs" --version
          timeout 120 "$zs" doctor || true
          timeout 1200 "$zs" build examples/simple.zs -o "$out"
          timeout 60 "$out"
      - run: ./test.sh --zs "dist/${{ matrix.archive }}/zs"
