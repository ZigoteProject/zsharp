# Temporary: the suite on Windows alone, with an earlier run's archives (round 4's, whose compiler
# is this tree's), so a change to the tests is tried in half an hour
name: windows-suite
on:
  push:
    branches: [claude/windows-diag]
permissions:
  contents: read
  actions: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, archive: zs-ci-windows-x86_64 }
          - { os: windows-11-arm, archive: zs-ci-windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: releases
          path: dist
          run-id: 42311657147
          github-token: ${{ github.token }}
      # LLVM's own release, the version the other runners have: Chocolatey's package is the x64
      # build on Windows on Arm too, whose libclang an arm64 zs.exe can't load (import c, and the
      # compiler's own build); zig from its release, 0.17.0 (0.16.0's `zig rc` fails on Windows
      # arm64, reading its cache's files short)
      - if: runner.os == 'Windows'
        run: |
          a=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
          dir=clang+llvm-23.1.4-$a-pc-windows-msvc
          # tar takes D:\... for a remote host's path: the temporary directory as MSYS names it
          t=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/$dir.tar.xz" \
            | tar -xJ -C "$t" --wildcards "$dir/bin/*" "$dir/lib/clang/*" "$dir/include/clang-c/*"
          cygpath -w "$t/$dir/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          Invoke-WebRequest "https://ziglang.org/download/0.17.0/zig-$a-windows-0.17.0.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\zig-$a-windows-0.17.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # pkg-config, which a package's [c] runs (tests/project/cwords), as apt gives Linux's: a
      # native one, a program zs.exe can start (the images list none)
      - if: runner.os == 'Windows'
        run: choco install -y --no-progress pkgconfiglite
      - run: tar -xzf "dist/${{ matrix.archive }}.tar.gz" -C dist
      - run: ./test.sh --zs "dist/${{ matrix.archive }}/zs"
