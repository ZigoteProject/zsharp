name: Bug report
description: The compiler, the library, a tool or the documentation does the wrong thing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A defect someone could exploit (safe code corrupting memory, a tool running or writing what it shouldn't) is reported privately, not here: see SECURITY.md.
  - type: textarea
    id: program
    attributes:
      label: The smallest program or steps that show it
      description: A whole program is best. For a project, the zs.toml and the commands.
      render: fsharp
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: The exact output or error message, as text.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `zs --version`, or the commit if built from source.
      placeholder: zs 0.7.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform the compiler runs on
      options:
        - Linux x86-64
        - Linux arm64
        - macOS arm64
        - macOS x86-64
        - Windows x64
        - Windows arm64
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target and build flags
      description: If not a plain build for this machine.
      placeholder: --target cortex-m4 --release
  - type: dropdown
    id: kind
    attributes:
      label: What kind of failure
      options:
        - A wrong result at run time
        - A crash, a hang or a leak at run time
        - The compiler crashes or hangs
        - A correct program is rejected
        - A wrong program is accepted
        - An unclear or wrong error message
        - A tool (fmt, test, lsp, mcp, packages)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: The output of `zs doctor` for a build problem; whether an earlier release worked.
