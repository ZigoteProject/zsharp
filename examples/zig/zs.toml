# Zig from Z# through the C ABI (README.md): cryptokit/ and unikit/ are Zig packages whose zig
# build makes a static library for each target; main.zs declares cryptokit's functions, Unikit.zs
# reads unikit's header with import c, and the archives for the target being built are linked
[package]
name = "zig-cryptokit"
main = "main.zs"

# zig build -Doptimize=ReleaseFast
[c.host]
link = ["cryptokit/zig-out/lib/libcryptokit.a", "unikit/zig-out/lib/libunikit.a"]

# zig build -Doptimize=ReleaseSmall -Dtarget=thumb-freestanding-eabihf -Dcpu=cortex_m4+vfp4d16sp
#   --prefix zig-out/cortex-m4
[c.cortex-m4]
link = ["cryptokit/zig-out/cortex-m4/lib/libcryptokit.a", "unikit/zig-out/cortex-m4/lib/libunikit.a"]
