# TLS for Z# (proposal 0032): c/mbedtls is Mbed TLS 3.6.7's library/ and include/, unmodified
# (https://github.com/Mbed-TLS/mbedtls, Apache-2.0, c/mbedtls/LICENSE; c/VERSION has the release
# and its hashes), built with its own configuration plus mutexes (c/config), under c/shim.c
[package]
name = "tls"
main = "src/Tls.zs"

[c]
include = ["c/config", "c/mbedtls/include", "c/mbedtls/library"]
sources = ["c/shim.c", "c/mbedtls/library/aes.c", "c/mbedtls/library/aesce.c", "c/mbedtls/library/aesni.c", "c/mbedtls/library/aria.c", "c/mbedtls/library/asn1parse.c", "c/mbedtls/library/asn1write.c", "c/mbedtls/library/base64.c", "c/mbedtls/library/bignum.c", "c/mbedtls/library/bignum_core.c", "c/mbedtls/library/bignum_mod.c", "c/mbedtls/library/bignum_mod_raw.c", "c/mbedtls/library/block_cipher.c", "c/mbedtls/library/camellia.c", "c/mbedtls/library/ccm.c", "c/mbedtls/library/chacha20.c", "c/mbedtls/library/chachapoly.c", "c/mbedtls/library/cipher.c", "c/mbedtls/library/cipher_wrap.c", "c/mbedtls/library/cmac.c", "c/mbedtls/library/constant_time.c", "c/mbedtls/library/ctr_drbg.c", "c/mbedtls/library/debug.c", "c/mbedtls/library/des.c", "c/mbedtls/library/dhm.c", "c/mbedtls/library/ecdh.c", "c/mbedtls/library/ecdsa.c", "c/mbedtls/library/ecjpake.c", "c/mbedtls/library/ecp.c", "c/mbedtls/library/ecp_curves.c", "c/mbedtls/library/ecp_curves_new.c", "c/mbedtls/library/entropy.c", "c/mbedtls/library/entropy_poll.c", "c/mbedtls/library/error.c", "c/mbedtls/library/gcm.c", "c/mbedtls/library/hkdf.c", "c/mbedtls/library/hmac_drbg.c", "c/mbedtls/library/lmots.c", "c/mbedtls/library/lms.c", "c/mbedtls/library/md5.c", "c/mbedtls/library/md.c", "c/mbedtls/library/memory_buffer_alloc.c", "c/mbedtls/library/mps_reader.c", "c/mbedtls/library/mps_trace.c", "c/mbedtls/library/net_sockets.c", "c/mbedtls/library/nist_kw.c", "c/mbedtls/library/oid.c", "c/mbedtls/library/padlock.c", "c/mbedtls/library/pem.c", "c/mbedtls/library/pk.c", "c/mbedtls/library/pkcs12.c", "c/mbedtls/library/pkcs5.c", "c/mbedtls/library/pkcs7.c", "c/mbedtls/library/pk_ecc.c", "c/mbedtls/library/pkparse.c", "c/mbedtls/library/pk_wrap.c", "c/mbedtls/library/pkwrite.c", "c/mbedtls/library/platform.c", "c/mbedtls/library/platform_util.c", "c/mbedtls/library/poly1305.c", "c/mbedtls/library/psa_crypto_aead.c", "c/mbedtls/library/psa_crypto.c", "c/mbedtls/library/psa_crypto_cipher.c", "c/mbedtls/library/psa_crypto_client.c", "c/mbedtls/library/psa_crypto_driver_wrappers_no_static.c", "c/mbedtls/library/psa_crypto_ecp.c", "c/mbedtls/library/psa_crypto_ffdh.c", "c/mbedtls/library/psa_crypto_hash.c", "c/mbedtls/library/psa_crypto_mac.c", "c/mbedtls/library/psa_crypto_pake.c", "c/mbedtls/library/psa_crypto_random.c", "c/mbedtls/library/psa_crypto_rsa.c", "c/mbedtls/library/psa_crypto_se.c", "c/mbedtls/library/psa_crypto_slot_management.c", "c/mbedtls/library/psa_crypto_storage.c", "c/mbedtls/library/psa_its_file.c", "c/mbedtls/library/psa_util.c", "c/mbedtls/library/ripemd160.c", "c/mbedtls/library/rsa_alt_helpers.c", "c/mbedtls/library/rsa.c", "c/mbedtls/library/sha1.c", "c/mbedtls/library/sha256.c", "c/mbedtls/library/sha3.c", "c/mbedtls/library/sha512.c", "c/mbedtls/library/ssl_cache.c", "c/mbedtls/library/ssl_ciphersuites.c", "c/mbedtls/library/ssl_client.c", "c/mbedtls/library/ssl_cookie.c", "c/mbedtls/library/ssl_debug_helpers_generated.c", "c/mbedtls/library/ssl_msg.c", "c/mbedtls/library/ssl_ticket.c", "c/mbedtls/library/ssl_tls12_client.c", "c/mbedtls/library/ssl_tls12_server.c", "c/mbedtls/library/ssl_tls13_client.c", "c/mbedtls/library/ssl_tls13_generic.c", "c/mbedtls/library/ssl_tls13_keys.c", "c/mbedtls/library/ssl_tls13_server.c", "c/mbedtls/library/ssl_tls.c", "c/mbedtls/library/threading.c", "c/mbedtls/library/timing.c", "c/mbedtls/library/version.c", "c/mbedtls/library/version_features.c", "c/mbedtls/library/x509.c", "c/mbedtls/library/x509_create.c", "c/mbedtls/library/x509_crl.c", "c/mbedtls/library/x509_crt.c", "c/mbedtls/library/x509_csr.c", "c/mbedtls/library/x509write.c", "c/mbedtls/library/x509write_crt.c", "c/mbedtls/library/x509write_csr.c"]

# Windows' entropy (BCryptGenRandom) and its certificate store
[c.x86_64-windows-gnu]
link = ["bcrypt", "crypt32"]

[c.aarch64-windows-gnu]
link = ["bcrypt", "crypt32"]
