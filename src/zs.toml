# The Z# compiler, in Z# (phase 11, proposal 0020; ARCHITECTURE.md beside this file is its map)
[package]
name = "zs"
version = "0.6.2"
main = "Main.zs"

# the machine the compiler runs on: its architecture and its own executable
[c]
sources = ["host.c"]

[dependencies]
libclang = { path = "../packages/libclang" }
xxhash = { path = "../packages/xxhash" }
