name = "Z#"
grammar = "zsharp"
path_suffixes = ["zs"]
line_comments = ["// "]
tab_size = 2
hard_tabs = false
autoclose_before = ";:.,=}])>| \n"
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
  { start = "[|", end = "|]", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
# the offside rule: a line ending in one of these opens a block
increase_indent_pattern = "(=|->|\\bthen|\\belse|\\bdo|\\bwith)\\s*(//.*)?$"
