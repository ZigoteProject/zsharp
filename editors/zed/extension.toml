id = "zsharp"
name = "Z#"
description = "Z# support: syntax highlighting, outline, and the zs language server (diagnostics, hover types, inlay hints)."
version = "0.1.0"
schema_version = 1
authors = ["Zigote Project <300591326+ZigoteProject@users.noreply.github.com>"]
repository = "https://github.com/ZigoteProject/zsharp"

# The grammar lives in this repository (editors/tree-sitter-zsharp). Zed fetches the repository
# at `rev` and builds the grammar from `path`. For a local dev extension, point `repository` at
# the checkout (file:///…/zsharp) and set `rev` to a commit that contains the grammar.
[grammars.zsharp]
repository = "https://github.com/ZigoteProject/zsharp"
rev = "fc55eff96a96a85e32bdfae48b43d980174ea2ca" # a commit containing editors/tree-sitter-zsharp with its generated src/parser.c
path = "editors/tree-sitter-zsharp"

[language_servers.zs]
name = "zs"
languages = ["Z#"]

# zs mcp: compiler-backed tools (check, type_at, docs, build, run, emit_llvm) for Zed's agent
[context_servers.zs]
